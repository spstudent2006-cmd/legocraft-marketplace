<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart | Legocraft</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="/js/theme.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#182442">
</head>
<body class="bg-surface text-on-surface font-body">
<div id="lc-header"></div>

<main class="max-w-4xl mx-auto px-4 md:px-8 py-8">
  <h1 class="font-display text-3xl text-primary mb-6" data-i18n="cart.title">Your Cart</h1>
  <div id="cart-items" class="flex flex-col gap-4"></div>
  <div id="cart-summary" class="mt-8 border-t border-surface-container pt-6 flex justify-between items-center"></div>
</main>

<div id="lc-footer"></div>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script src="/js/partials.js"></script>
<script>
function render() {
  const items = Cart.get();
  const wrap = document.getElementById("cart-items");
  const summary = document.getElementById("cart-summary");

  if (items.length === 0) {
    wrap.innerHTML = `<p class="text-on-surface-variant py-12 text-center">${t("cart.empty")} <a href="/products.html" class="text-secondary hover:underline">${t("cart.startShopping")}</a></p>`;
    summary.innerHTML = "";
    return;
  }

  wrap.innerHTML = items.map(i => {
    const img = i.image ? `<img src="${i.image}" class="w-full h-full object-cover">` : `<div class="w-full h-full bg-surface-container-high flex items-center justify-center"><span class="material-symbols-outlined text-outline">image</span></div>`;
    return `
    <div class="flex items-center gap-4 border border-surface-container rounded-lg p-3">
      <div class="w-20 h-20 rounded overflow-hidden bg-surface-container-low shrink-0">${img}</div>
      <div class="flex-1">
        <p class="font-body text-sm">${escapeHtml(i.title)}</p>
        <p class="text-primary font-semibold">₹${i.price}</p>
      </div>
      <input type="number" min="1" value="${i.qty}" data-id="${i.id}" class="qty-input w-16 border border-outline-variant rounded px-2 py-1 text-sm text-center">
      <button data-remove="${i.id}" class="text-error hover:underline text-sm">${t("common.remove")}</button>
    </div>`;
  }).join("");

  wrap.querySelectorAll(".qty-input").forEach(inp => inp.onchange = () => {
    Cart.setQty(inp.dataset.id, Math.max(1, Number(inp.value || 1)));
    render();
  });
  wrap.querySelectorAll("[data-remove]").forEach(btn => btn.onclick = () => {
    Cart.remove(btn.dataset.remove);
    render();
  });

  summary.innerHTML = `
    <p class="font-display text-xl">${t("common.total")}: <span class="text-primary">₹${Cart.total()}</span></p>
    <a href="/checkout.html" class="bg-primary text-on-primary font-medium px-6 py-3 rounded hover:bg-primary-container transition-colors">${t("cart.proceedToCheckout")}</a>`;
}
render();
document.addEventListener("lc-lang-changed", render);
</script>
</body>
</html>
