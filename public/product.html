<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product | Legocraft</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="/js/theme.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#182442">
<style>
  .lc-gallery::-webkit-scrollbar { display: none; }
  .lc-gallery { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="bg-surface text-on-surface font-body">
<div id="lc-header"></div>

<main class="max-w-5xl mx-auto px-4 md:px-8 py-8">
  <div id="content" class="grid md:grid-cols-2 gap-10"></div>
</main>

<div id="lc-footer"></div>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script src="/js/partials.js"></script>
<script>
const id = new URLSearchParams(location.search).get("id");

function galleryImgError(imgEl) {
  const wrap = imgEl.parentElement;
  if (!wrap) return;
  const placeholder = document.createElement("div");
  placeholder.className = "w-full h-full bg-surface-container-high flex items-center justify-center shrink-0 snap-center";
  const icon = document.createElement("span");
  icon.className = "material-symbols-outlined text-[64px] text-outline";
  icon.textContent = "image";
  placeholder.appendChild(icon);
  wrap.replaceWith(placeholder);
}
window.galleryImgError = galleryImgError;

function buildGalleryHtml(images, title) {
  const placeholderHtml = `<div class="w-full h-full bg-surface-container-high flex items-center justify-center shrink-0 snap-center"><span class="material-symbols-outlined text-[64px] text-outline">image</span></div>`;
  const slides = images.length
    ? images.map(src => `<div class="w-full h-full shrink-0 snap-center"><img src="${src}" class="w-full h-full object-cover" alt="${escapeHtml(title)}" onerror="galleryImgError(this)"></div>`).join("")
    : placeholderHtml;
  const dots = images.length > 1
    ? `<div id="gallery-dots" class="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-1.5 z-10">
        ${images.map((_, i) => `<button data-dot="${i}" class="w-2 h-2 rounded-full ${i === 0 ? "bg-white" : "bg-white/50"} transition-colors" aria-label="Show photo ${i + 1}"></button>`).join("")}
      </div>`
    : "";
  const arrows = images.length > 1
    ? `<button id="gallery-prev" type="button" aria-label="Previous photo" class="hidden md:flex absolute left-2 top-1/2 -translate-y-1/2 w-9 h-9 items-center justify-center rounded-full bg-white/90 text-on-surface shadow hover:bg-white z-10">
        <span class="material-symbols-outlined text-[20px]">chevron_left</span>
      </button>
      <button id="gallery-next" type="button" aria-label="Next photo" class="hidden md:flex absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 items-center justify-center rounded-full bg-white/90 text-on-surface shadow hover:bg-white z-10">
        <span class="material-symbols-outlined text-[20px]">chevron_right</span>
      </button>`
    : "";
  const counter = images.length > 1
    ? `<div id="gallery-counter" class="absolute top-3 right-3 bg-on-surface/60 text-white text-xs px-2 py-1 rounded-full z-10">1 / ${images.length}</div>`
    : "";
  return `
    <div class="relative aspect-square rounded-lg overflow-hidden bg-surface-container-low group">
      <div id="gallery-track" class="lc-gallery w-full h-full flex overflow-x-auto snap-x snap-mandatory scroll-smooth">${slides}</div>
      ${arrows}
      ${dots}
      ${counter}
    </div>`;
}

function initGallery(count) {
  const track = document.getElementById("gallery-track");
  if (!track || count <= 1) return;
  const dots = [...document.querySelectorAll("[data-dot]")];
  const counter = document.getElementById("gallery-counter");
  const prevBtn = document.getElementById("gallery-prev");
  const nextBtn = document.getElementById("gallery-next");
  let current = 0;

  function goTo(i) {
    current = Math.max(0, Math.min(count - 1, i));
    track.scrollTo({ left: current * track.clientWidth, behavior: "smooth" });
  }
  function updateActive() {
    current = Math.round(track.scrollLeft / track.clientWidth);
    dots.forEach((d, i) => {
      d.classList.toggle("bg-white", i === current);
      d.classList.toggle("bg-white/50", i !== current);
    });
    if (counter) counter.textContent = `${current + 1} / ${count}`;
  }
  let scrollTimer;
  track.addEventListener("scroll", () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(updateActive, 80);
  });
  dots.forEach((d, i) => d.onclick = () => goTo(i));
  prevBtn?.addEventListener("click", () => goTo(current - 1));
  nextBtn?.addEventListener("click", () => goTo(current + 1));
  window.addEventListener("resize", () => goTo(current));
}

async function load() {
  const el = document.getElementById("content");
  if (!id) { el.innerHTML = `<p class="text-error">${t("product.notSpecified")}</p>`; return; }
  try {
    const { product: p } = await api(`/api/products/${id}`);
    document.title = `${p.title} | Legocraft`;
    const images = (p.images && p.images.length) ? p.images : (p.image ? [p.image] : []);
    const gallery = buildGalleryHtml(images, p.title);
    el.innerHTML = `
      ${gallery}
      <div>
        <p class="text-sm text-secondary font-body">${escapeHtml(p.category)}</p>
        <h1 class="font-display text-3xl text-primary mt-1">${escapeHtml(p.title)}</h1>
        <p class="text-sm text-on-surface-variant mt-1">${t("common.soldBy")} ${escapeHtml(p.shopName)}</p>
        <p class="font-display text-2xl text-on-surface mt-4">₹${p.price}</p>
        <p class="text-sm mt-1 ${p.stock > 0 ? "text-success" : "text-error"}">${p.stock > 0 ? `${p.stock} ${t("common.inStock")}` : t("common.outOfStock")}</p>
        <div class="mt-6 flex items-center justify-between gap-2">
          <p id="desc-text" class="text-on-surface-variant leading-relaxed">${escapeHtml(p.description)}</p>
        </div>
        ${p.descriptionHi ? `<button id="desc-lang-toggle" class="mt-2 text-xs text-secondary hover:underline">${t("product.readHindi")}</button>` : ""}
        <div class="mt-8 flex flex-wrap gap-3 items-center">
          <input id="qty" type="number" value="1" min="1" max="${p.stock}" class="w-20 border border-outline-variant rounded px-3 py-2 text-sm" ${p.stock === 0 ? "disabled" : ""}>
          <button id="add-btn" class="bg-primary text-on-primary font-medium px-6 py-3 rounded hover:bg-primary-container transition-colors disabled:opacity-40" ${p.stock === 0 ? "disabled" : ""}>${t("common.addToCart")}</button>
          <button id="buy-btn" class="border border-secondary text-secondary font-medium px-6 py-3 rounded hover:bg-secondary-container/20 transition-colors disabled:opacity-40" ${p.stock === 0 ? "disabled" : ""}>${t("common.buyNow")}</button>
        </div>
      </div>`;
    initGallery(images.length);
    document.getElementById("desc-lang-toggle")?.addEventListener("click", (e) => {
      const descEl = document.getElementById("desc-text");
      const showingHindi = descEl.dataset.lang === "hi";
      descEl.textContent = showingHindi ? p.description : p.descriptionHi;
      descEl.dataset.lang = showingHindi ? "en" : "hi";
      e.target.textContent = showingHindi ? t("product.readHindi") : t("product.readEnglish");
    });
    document.getElementById("add-btn")?.addEventListener("click", () => {
      const qty = Math.max(1, Number(document.getElementById("qty").value || 1));
      Cart.add(p, qty);
      toast(t("common.addedToCart"));
    });
    document.getElementById("buy-btn")?.addEventListener("click", () => {
      const qty = Math.max(1, Number(document.getElementById("qty").value || 1));
      Cart.add(p, qty);
      location.href = "/checkout.html";
    });
  } catch (e) {
    el.innerHTML = `<p class="text-error col-span-2">${escapeHtml(e.message)}</p>`;
  }
}
load();
document.addEventListener("lc-lang-changed", load);
</script>
</body>
</html>
