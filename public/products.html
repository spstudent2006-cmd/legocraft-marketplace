<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop | Legocraft</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="/js/theme.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#182442">
</head>
<body class="bg-surface text-on-surface font-body">
<div id="lc-header"></div>

<main class="max-w-6xl mx-auto px-4 md:px-8 py-8">
  <h1 class="font-display text-3xl text-primary mb-6" data-i18n="products.title">Shop Handmade</h1>

  <div class="flex flex-col md:flex-row gap-8">
    <aside class="md:w-56 shrink-0">
      <p class="font-body font-semibold text-sm mb-2 text-on-surface-variant" data-i18n="products.category">Category</p>
      <div id="cat-filters" class="flex flex-col gap-1 font-body text-sm"></div>
    </aside>
    <div class="flex-1">
      <p id="result-count" class="text-sm text-on-surface-variant mb-3"></p>
      <div id="grid" class="grid grid-cols-2 md:grid-cols-3 gap-5"></div>
    </div>
  </div>
</main>

<div id="lc-footer"></div>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script src="/js/partials.js"></script>
<script>
const params = new URLSearchParams(location.search);
let activeCategory = params.get("category") || "";
const searchTerm = params.get("search") || "";

function cardHtml(p) {
  const placeholderHtml = `<div class=\"w-full h-full bg-surface-container-high flex items-center justify-center\"><span class=\"material-symbols-outlined text-[32px] text-outline\">image</span></div>`;
  const img = p.image ? `<img src="${p.image}" class="w-full h-full object-cover" alt="${escapeHtml(p.title)}" onerror="this.outerHTML='${placeholderHtml.replace(/'/g, "\\'")}'">` : placeholderHtml;
  return `<a href="/product.html?id=${p.id}" class="block group">
    <div class="aspect-square rounded-lg overflow-hidden bg-surface-container-low">${img}</div>
    <p class="mt-2 font-body text-sm text-on-surface line-clamp-2 group-hover:text-primary">${escapeHtml(p.title)}</p>
    <p class="text-xs text-on-surface-variant">${escapeHtml(p.shopName)}</p>
    <p class="font-body font-semibold text-primary">₹${p.price}</p>
  </a>`;
}

async function loadCategories() {
  const { categories } = await api("/api/categories");
  const wrap = document.getElementById("cat-filters");
  const all = ["", ...categories];
  wrap.innerHTML = all.map(c => `
    <button data-cat="${c}" class="cat-btn text-left px-3 py-1.5 rounded ${c === activeCategory ? "bg-primary text-on-primary" : "hover:bg-surface-container-low"}">${c || t("common.allCategories")}</button>
  `).join("");
  wrap.querySelectorAll(".cat-btn").forEach(btn => btn.onclick = () => {
    activeCategory = btn.dataset.cat;
    loadCategories();
    loadProducts();
  });
}

async function loadProducts() {
  const grid = document.getElementById("grid");
  const count = document.getElementById("result-count");
  const q = new URLSearchParams();
  if (activeCategory) q.set("category", activeCategory);
  if (searchTerm) q.set("search", searchTerm);
  try {
    const { products } = await api(`/api/products?${q}`);
    count.textContent = `${products.length} product${products.length === 1 ? "" : "s"}`;
    grid.innerHTML = products.map(cardHtml).join("") || `<p class="col-span-full text-on-surface-variant py-12 text-center">${t("common.noProductsFound")}</p>`;
  } catch (e) {
    grid.innerHTML = `<p class="col-span-full text-error">${e.message}</p>`;
  }
}
loadCategories();
loadProducts();
document.addEventListener("lc-lang-changed", () => { loadCategories(); loadProducts(); });
</script>
</body>
</html>
